{% load static %}
<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Můj první blog</title>
    <link rel="stylesheet" href="{% static 'blog/blog.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="page header-content">
            <h1>Můj první blog</h1>
            <a class="admin-link" href="{% url 'admin:index' %}">Administrace</a>
        </div>
    </header>

    <main class="page posts">
        {% for post in posts %}
            <article>
                <time datetime="{{ post.published_date|date:'c' }}">{{ post.published_date|date:'j. n. Y' }}</time>
                <h2>{{ post.title }}</h2>
                <div class="post-body">{{ post.text|linebreaks }}</div>
            </article>
        {% empty %}
            <p class="empty">Zatím tu nejsou žádné publikované příspěvky.</p>
        {% endfor %}
    </main>
</body>
</html>
